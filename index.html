    const Security = {
      sanitize(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      },
      normalizeAnswer(str) {
        return String(str || '').trim().toLowerCase().replace(/\s+/g, '');
      }
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-400',
        error: 'bg-rose-600 text-white border-rose-400',
        warning: 'bg-amber-500 text-slate-950 border-amber-300',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-exclamation',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-semibold transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base"></i><span>${Security.sanitize(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 300);
      }, 3400);
    }

      const root = document.getElementById('modal-root');

    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';

    function getAllSubmaterials() {
      const list = [];
      AppState.chapters.forEach(ch => {
        ch.submaterials.forEach(sub => {
          list.push({ ...sub, chapterNumber: ch.number, chapterTitle: ch.title });
        });
      });
      return list;
    }

    function getCurrentStudent() {
      return AppState.students.find(s => s.id === AppState.currentStudentId) || null;
    }

    function getStudentProgressPercent(student) {
      const totalSubs = getAllSubmaterials().filter(s => s.status === 'published').length;
      if (!totalSubs) return 0;
      const done = student.completedSubmaterials.length;
      return Math.min(100, Math.round((done / totalSubs) * 100));
    }

    function getStudentBestSummative(student) {
      if (!student.summativeHistory || student.summativeHistory.length === 0) return null;
      return Math.max(...student.summativeHistory.map(h => h.score));
    }

    function getStudentLevel(points) {
      if (points >= 600) return { level: 5, title: 'Grandmaster PLSV', next: 800 };
      if (points >= 450) return { level: 4, title: 'Ahli Kesetaraan', next: 600 };
      if (points >= 300) return { level: 3, title: 'Arsitek Aljabar', next: 450 };
      if (points >= 150) return { level: 2, title: 'Penjelajah Variabel', next: 300 };
      return { level: 1, title: 'Ksatria Pemula', next: 150 };
    }

    function evaluateStudentBadges(student) {
      const earned = new Set(student.badges || []);
      if (student.completedSubmaterials.length >= 1) earned.add('b-starter');
      if (student.completedSubmaterials.includes('sub-1-1') && student.completedSubmaterials.includes('sub-1-2')) earned.add('b-detective');
      if (student.completedSubmaterials.includes('sub-2-1') && student.completedSubmaterials.includes('sub-2-2')) earned.add('b-balancer');
      if (student.completedSubmaterials.includes('sub-3-1') && student.completedSubmaterials.includes('sub-3-2')) earned.add('b-machine');
      if (student.completedSubmaterials.includes('sub-4-1') && student.completedSubmaterials.includes('sub-4-2')) earned.add('b-modeler');
      if (student.points >= 300) earned.add('b-streak');
      const bestSum = getStudentBestSummative(student);
      if (bestSum !== null && bestSum >= AppState.summativeConfig.passingGrade) earned.add('b-champion');
      student.badges = Array.from(earned);
    }

    function handleStudentLogin(e) {

        AppState.screen = 'student';
        AppState.studentTab = 'map';
        showToast(`Halo ${stu.name}! Selamat berpetualang di EQUAQUEST.`, 'success');
        renderApp();
      } else {
        showToast('Kata sandi murid salah!', 'error');
      }
    }

    function logoutToLanding() {
      if (AppState.summativeTimerInterval) {
        clearInterval(AppState.summativeTimerInterval);
        AppState.summativeTimerInterval = null;
      }
      AppState.screen = 'landing';
      AppState.currentStudentId = null;
      AppState.quizSession = null;
      AppState.summativeSession = null;
      renderApp();
    }

    // =========================================================================
    // 7. PORTAL PETUALANGAN MURID (STUDENT LMS)
    // =========================================================================
    function renderStudentPortal() {
      const student = getCurrentStudent();
      if (!student) return renderLandingPage();

      const progressPct = getStudentProgressPercent(student);
      const lvl = getStudentLevel(student.points);
      const bestSum = getStudentBestSummative(student);
      const isSummativeUnlocked = progressPct === 100;

      const navItems = [
        { id: 'map', label: 'Peta Petualangan', icon: 'fa-map-location-dot' },
        { id: 'lesson', label: 'Ruang Belajar', icon: 'fa-book-open-reader' },
        { id: 'summative', label: 'Asesmen Sumatif', icon: isSummativeUnlocked ? 'fa-file-signature' : 'fa-lock' },
        { id: 'badges', label: 'Lencana & Profil', icon: 'fa-award' }
      ];

      let mainContent = '';
      if (AppState.studentTab === 'map') {
        mainContent = renderStudentMap(student, progressPct, isSummativeUnlocked);
      } else if (AppState.studentTab === 'lesson') {
        mainContent = renderStudentLesson(student);
      } else if (AppState.studentTab === 'summative') {
        mainContent = renderStudentSummative(student, isSummativeUnlocked);
      } else if (AppState.studentTab === 'badges') {
        mainContent = renderStudentBadges(student, lvl, progressPct, bestSum);
      }

      return `
        <div class="flex-1 flex flex-col lg:flex-row bg-slate-100 min-h-screen">

              <div class="flex items-center justify-between lg:justify-start gap-3">
                ${renderSchoolLogo('w-10 h-10')}
                <div>
                  <span class="font-display font-black text-lg tracking-tight block">EQUAQUEST</span>
                  <span class="text-[11px] text-purple-200 font-semibold">Portal Petualangan Murid</span>
                </div>
              </div>

              <!-- Kartu Profil Singkat -->
              <div class="p-4 rounded-2xl bg-white/10 border border-white/15 space-y-3">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-amber-400 text-slate-950 font-display font-black flex items-center justify-center text-base">
                    ${Security.sanitize(student.name.charAt(0))}
                  </div>
                  <div class="min-w-0">
                    <p class="font-bold text-sm truncate">${Security.sanitize(student.name)}</p>
                    <p class="text-xs text-purple-200">Kelas ${Security.sanitize(student.className)} • Lv.${lvl.level}</p>
                  </div>
                </div>
                <div class="flex items-center justify-between text-xs font-bold">
                  <span class="text-amber-300"><i class="fa-solid fa-bolt mr-1"></i>${student.points} XP</span>
                  <span class="text-emerald-300">Progres ${progressPct}%</span>
                </div>
                <div class="w-full h-2 rounded-full bg-white/15 overflow-hidden">
                  <div class="h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-300" style="width: ${progressPct}%"></div>
                </div>
              </div>

              <!-- Navigasi Murid -->
              <nav class="grid grid-cols-2 lg:grid-cols-1 gap-2">
                ${navItems.map(item => {
                  const active = AppState.studentTab === item.id;
                  return `
                    <button onclick="switchStudentTab('${item.id}')" class="flex items-center gap-3 px-4 py-3 rounded-2xl text-xs sm:text-sm font-bold transition text-left ${active ? 'bg-purple-600 text-white shadow-lg' : 'text-purple-100 hover:bg-white/10'}">
                      <i class="fa-solid ${item.icon} w-4 text-center"></i>
                      <span>${item.label}</span>
                    </button>

            </div>
          </aside>

          <!-- MAIN CONTENT MURID -->
          <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-6xl w-full mx-auto">
            ${mainContent}
          </main>
        </div>
      `;

      AppState.studentTab = tab;

            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-2xl ${isSummativeUnlocked ? 'bg-slate-950 text-amber-400' : 'bg-slate-400 text-white'} flex items-center justify-center text-2xl flex-shrink-0">
                <i class="fa-solid ${isSummativeUnlocked ? 'fa-unlock-keyhole' : 'fa-lock'}"></i>
              </div>
              <div>
                <h3 class="font-display font-black text-xl">${Security.sanitize(AppState.summativeConfig.title)}</h3>
                <p class="text-xs sm:text-sm font-medium mt-0.5">
                  ${isSummativeUnlocked
                    ? 'Selamat! Progres belajarmu sudah 100%. Gembok Asesmen Sumatif telah terbuka!'
                    : `Tuntaskan seluruh submateri terlebih dahulu untuk membuka ujian akhir (Progres saat ini: ${progressPct}%).`}

            <button onclick="switchStudentTab('summative')" ${!isSummativeUnlocked ? 'disabled' : ''} class="px-6 py-3 rounded-2xl font-display font-extrabold text-sm ${isSummativeUnlocked ? 'bg-slate-950 text-white hover:bg-slate-800 shadow-lg' : 'bg-slate-400 text-slate-200 cursor-not-allowed'}">

    function openSubmaterialLesson(subId) {
      AppState.activeSubmaterialId = subId;
      AppState.lessonStep = 'read';
      AppState.studentTab = 'lesson';
      AppState.quizSession = null;
      renderApp();
    }

    function setStudentLessonStep(step) {
      AppState.lessonStep = step;
      if (step === 'practice' && !AppState.quizSession) {
        startPracticeQuiz(AppState.activeSubmaterialId);
      }
      renderApp();
    }

    function renderStudentLesson(student) {
      const allSubs = getAllSubmaterials();
      const sub = allSubs.find(s => s.id === AppState.activeSubmaterialId) || allSubs[0];
      if (!sub) return '';

      const steps = [
        { id: 'read', label: '1. Materi', icon: 'fa-book-open' },
        { id: 'example', label: '2. Contoh Soal', icon: 'fa-lightbulb' },
        { id: 'interactive', label: '3. Simulasi', icon: 'fa-flask' },
        { id: 'practice', label: '4. Latihan (10 Soal)', icon: 'fa-pen-to-square' },
        { id: 'reflect', label: '5. Refleksi', icon: 'fa-comment-dots' }
      ];

      let bodyHtml = '';
      if (AppState.lessonStep === 'read') {
        const paragraphs = sub.explanation.split('\n\n').filter(Boolean);
        const keyPoints = sub.keyPoints || [];
        bodyHtml = `
          <div class="space-y-5">
            <div class="p-4 rounded-2xl bg-blue-50 border border-blue-200">
              <span class="text-xs font-extrabold uppercase text-blue-700">Tujuan Pembelajaran:</span>
              <p class="text-sm font-bold text-blue-950 mt-0.5">${Security.sanitize(sub.goal)}</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">

              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                <strong class="text-indigo-700 block mb-1">Indikator Inti</strong>
                <span>${Security.sanitize(sub.indicators.inti)}</span>
              </div>
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                <strong class="text-purple-700 block mb-1">Indikator Pengayaan</strong>

              </div>

                <h5 class="font-display font-extrabold text-sm text-amber-900 uppercase tracking-wide">
                  <i class="fa-solid fa-key mr-1.5"></i> Poin-Poin Kunci yang Wajib Dikuasai:
                </h5>
                <ul class="space-y-1.5 text-xs sm:text-sm text-amber-950">
                  ${keyPoints.map(kp => `
                    <li class="flex items-start gap-2">
                      <i class="fa-solid fa-circle-check text-amber-600 mt-1 flex-shrink-0"></i>
                      <span>${Security.sanitize(kp)}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>
            ` : ''}
            <div class="p-4 rounded-2xl bg-indigo-600 text-white text-center font-mono font-bold text-base sm:text-lg shadow">

              <strong><i class="fa-solid fa-bookmark mr-1"></i> Rangkuman:</strong> ${Security.sanitize(sub.summary)}
            </div>
            <div class="flex justify-end">
              <button onclick="setStudentLessonStep('example')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-2xl text-sm shadow">

              </button>
            </div>
          </div>
        `;
      } else if (AppState.lessonStep === 'example') {
        const exampleList = sub.examples || (sub.example ? [sub.example] : []);
        bodyHtml = `
          <div class="space-y-6">

          <div class="space-y-5">

              <div>
                <button onclick="switchStudentTab('map')" class="text-xs font-extrabold text-purple-700 hover:underline mb-1 inline-flex items-center gap-1">

                </button>
                <h1 class="font-display font-black text-xl sm:text-2xl text-slate-900">
                  Bab ${sub.chapterNumber}.${sub.order}: ${Security.sanitize(sub.title)}

              <select onchange="openSubmaterialLesson(this.value)" class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold bg-slate-50">
                ${allSubs.map(item => `
                  <option value="${item.id}" ${item.id === sub.id ? 'selected' : ''}>Bab ${item.chapterNumber}.${item.order} — ${Security.sanitize(item.title)}</option>

    function saveStudentReflection(subId) {
      const student = getCurrentStudent();
      const txt = document.getElementById('reflection-input').value.trim();
      if (!txt) {
        showToast('Tuliskan refleksi singkatmu terlebih dahulu.', 'warning');
        return;
      }
      student.reflections[subId] = txt;
      student.points += 15;
      evaluateStudentBadges(student);
      showToast('Refleksi tersimpan (+15 XP)!', 'success');
      switchStudentTab('map');
    }

    // =========================================================================
    // 8. SIMULASI INTERAKTIF PLSV (5 LAB VIRTUAL)
    // =========================================================================
    function renderInteractiveSimulation(sub) {
      const type = sub.interactiveType;
      let simHtml = '';

      if (type === 'detective-tp1') {
        const items = [
          { text: '14 + 9 = 23', cat: 'tertutup-benar', explain: 'Tidak ada variabel dan hasilnya tepat 23 (Kalimat Tertutup Benar).' },
          { text: '3x − 5 = 16', cat: 'terbuka', explain: 'Memuat variabel x sehingga belum diketahui benar/salahnya (Kalimat Terbuka).' },
          { text: 'Semua bilangan prima adalah ganjil.', cat: 'tertutup-salah', explain: 'Pernyataan pasti salah karena 2 adalah bilangan prima genap (Kalimat Tertutup Salah).' },
          { text: '2m + 1 > 9', cat: 'terbuka', explain: 'Memuat variabel m sehingga termasuk Kalimat Terbuka.' }
        ];
        const idx = AppState.simState.detectiveIdx % items.length;
        const cur = items[idx];
        simHtml = `
          <div class="p-6 rounded-3xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 space-y-5">
            <div class="flex items-center justify-between">
              <span class="px-3 py-1 rounded-full bg-blue-600 text-white text-xs font-extrabold">Lab Detektif Kalimat Matematika</span>
              <span class="text-xs font-extrabold text-blue-900">Skor Simulasi: ${AppState.simState.detectiveScore}</span>
            </div>
            <div class="p-6 rounded-2xl bg-white border-2 border-blue-300 text-center shadow-sm">
              <span class="text-xs uppercase font-bold text-slate-400">Analisis Kalimat Berikut:</span>
              <p class="font-display font-black text-xl sm:text-2xl text-slate-900 mt-2">“${Security.sanitize(cur.text)}”</p>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <button onclick="checkDetectiveSim('tertutup-benar')" class="p-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow">Kalimat Tertutup Benar</button>
              <button onclick="checkDetectiveSim('tertutup-salah')" class="p-3.5 rounded-2xl bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs shadow">Kalimat Tertutup Salah</button>
              <button onclick="checkDetectiveSim('terbuka')" class="p-3.5 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow">Kalimat Terbuka (Bervariabel)</button>
            </div>
          </div>
        `;
      } else if (type === 'subst-tp2') {
        const xVal = AppState.simState.substX;
        const leftVal = 3 * xVal - 4;
        const targetVal = 14;
        const isMatch = leftVal === targetVal;
        simHtml = `
          <div class="p-6 rounded-3xl bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-200 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="px-3 py-1 rounded-full bg-indigo-600 text-white text-xs font-extrabold">Lab Penguji Akar PLSV: 3x − 4 = 14</span>
              <span class="text-xs font-bold text-indigo-900">Geser nilai x hingga ruas kiri = 14</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-indigo-200 space-y-4">
              <div class="flex items-center justify-between text-sm font-extrabold">
                <span>Nilai Pengganti x = <span class="text-purple-700 text-xl">${xVal}</span></span>
                <span>Hasil Ruas Kiri: 3(${xVal}) − 4 = <span class="${isMatch ? 'text-emerald-600' : 'text-rose-600'} text-xl">${leftVal}</span></span>
              </div>
              <input type="range" min="1" max="10" value="${xVal}" oninput="updateSubstSim(this.value)" class="w-full accent-purple-600 cursor-pointer" />
              <div class="p-4 rounded-2xl text-center font-bold text-sm ${isMatch ? 'bg-emerald-600 text-white' : 'bg-amber-100 text-amber-950'}">
                ${isMatch
                  ? 'TEPAT SEKALI! x = 6 membuat 3(6) − 4 = 14 bernilai BENAR, sehingga HP = {6}.'
                  : `Belum setara (${leftVal} ≠ 14). Terus geser nilai x!`}
              </div>
            </div>
          </div>
        `;
      } else if (type === 'balance-tp4') {
        const { balanceLeftX, balanceLeftConst, balanceRightX, balanceRightConst } = AppState.simState;
        const solved = balanceLeftX === 1 && balanceRightX === 0 && balanceLeftConst === 0;
        simHtml = `
          <div class="p-6 rounded-3xl bg-gradient-to-br from-emerald-50 to-teal-50 border border-emerald-200 space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <span class="px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold">Timbangan Kesetaraan Aljabar</span>
              <button onclick="resetBalanceSim()" class="px-3 py-1 rounded-xl bg-white border border-emerald-300 text-xs font-bold text-emerald-800">Reset Timbangan</button>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-center">
              <div class="p-5 rounded-2xl bg-white border-2 border-emerald-400 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase">Lengan Kiri (Ruas Kiri)</span>
                <p class="font-display font-black text-2xl text-slate-900 mt-1">${balanceLeftX}x + ${balanceLeftConst}</p>
              </div>
              <div class="p-5 rounded-2xl bg-white border-2 border-teal-400 shadow-sm">
                <span class="text-xs font-bold text-slate-400 uppercase">Lengan Kanan (Ruas Kanan)</span>
                <p class="font-display font-black text-2xl text-slate-900 mt-1">${balanceRightX}x + ${balanceRightConst}</p>
              </div>
            </div>
            <div class="flex flex-wrap justify-center gap-2.5">
              <button onclick="applyBalanceOp('subX')" class="px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs shadow">Kurangi Kedua Ruas dengan 1x (− x)</button>
              <button onclick="applyBalanceOp('sub3')" class="px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow">Kurangi Kedua Ruas dengan 3 (− 3)</button>
            </div>
            ${solved ? `
              <div class="p-4 rounded-2xl bg-emerald-600 text-white text-center font-bold text-sm">
                <i class="fa-solid fa-circle-check mr-1"></i> Timbangan Setimbang Sempurna! Diperoleh x = ${balanceRightConst}.
              </div>
            ` : ''}
          </div>
        `;
      } else if (type === 'machine-tp5') {
        const step = AppState.simState.machineStep;
        const stages = [
          { eq: '3(x − 2) = 15', hint: 'Langkah 1: Jabarkan tanda kurung dengan sifat distributif (3 × x dan 3 × −2).' },
          { eq: '3x − 6 = 15', hint: 'Langkah 2: Tambahkan kedua ruas dengan 6 untuk menetralkan −6.' },
          { eq: '3x = 21', hint: 'Langkah 3: Bagi kedua ruas dengan koefisien 3.' },
          { eq: 'x = 7  ⇒  HP = {7}', hint: 'Selesai! Nilai x = 7 telah ditemukan.' }
        ];
        const cur = stages[step];
        simHtml = `
          <div class="p-6 rounded-3xl bg-gradient-to-br from-purple-50 to-pink-50 border border-purple-200 space-y-5">
            <div class="flex items-center justify-between">
              <span class="px-3 py-1 rounded-full bg-purple-600 text-white text-xs font-extrabold">Mesin Operasi PLSV Bertahap</span>
              <span class="text-xs font-bold text-purple-900">Tahap ${step + 1} dari ${stages.length}</span>
            </div>
            <div class="p-6 rounded-2xl bg-slate-900 text-amber-300 font-mono font-black text-2xl sm:text-3xl text-center shadow-inner">
              ${cur.eq}
            </div>
            <p class="text-xs sm:text-sm font-semibold text-purple-950 bg-white p-4 rounded-2xl border border-purple-200">${cur.hint}</p>
            <div class="flex justify-center gap-3">
              <button onclick="setMachineStep(0)" class="px-4 py-2.5 rounded-xl bg-slate-200 font-bold text-xs text-slate-700">Ulangi</button>
              <button onclick="setMachineStep(${Math.min(stages.length - 1, step + 1)})" class="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow">
                Jalankan Langkah Berikutnya <i class="fa-solid fa-play ml-1"></i>
              </button>
            </div>
          </div>
        `;
      } else {
        simHtml = `
          <div class="p-6 rounded-3xl bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200 space-y-5">
            <span class="px-3 py-1 rounded-full bg-amber-500 text-slate-950 text-xs font-extrabold">Lab Pemodelan Geometri Persegi Panjang</span>
            <p class="text-xs sm:text-sm text-slate-700">Diketahui persegi panjang dengan <strong>panjang = (2x + 3) cm</strong>, <strong>lebar = x cm</strong>, dan <strong>keliling = 36 cm</strong>. Model PLSV-nya adalah <code>2((2x + 3) + x) = 36</code> atau <code>6x + 6 = 36</code>.</p>
            <div class="flex flex-wrap items-center gap-3">
              <input id="sim-model-x" type="number" value="${Security.sanitize(AppState.simState.modelGuessX)}" placeholder="Masukkan nilai x..." class="px-4 py-2.5 rounded-xl border border-amber-300 text-sm font-bold w-48" />
              <button onclick="checkModelGeoSim()" class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs shadow">Uji Ukuran Taman</button>
            </div>
            <div id="sim-model-feedback" class="text-xs font-bold text-amber-950"></div>
          </div>
        `;
      }

      return `
        <div class="space-y-5">
          ${simHtml}
          <div class="flex justify-between pt-2">
            <button onclick="setStudentLessonStep('example')" class="px-5 py-3 rounded-2xl bg-slate-100 font-bold text-sm text-slate-700">Kembali ke Contoh</button>
            <button onclick="setStudentLessonStep('practice')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-2xl text-sm shadow">
              Mulai Latihan 10 Soal <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
          </div>
        </div>
      `;
    }

    function checkDetectiveSim(choice) {
      const items = [
        { text: '14 + 9 = 23', cat: 'tertutup-benar' },
        { text: '3x − 5 = 16', cat: 'terbuka' },
        { text: 'Semua bilangan prima adalah ganjil.', cat: 'tertutup-salah' },
        { text: '2m + 1 > 9', cat: 'terbuka' }
      ];
      const cur = items[AppState.simState.detectiveIdx % items.length];
      if (choice === cur.cat) {
        AppState.simState.detectiveScore += 25;
        showToast('Analisis tepat! +25 poin simulasi.', 'success');
      } else {
        showToast('Kurang tepat, perhatikan apakah ada huruf variabelnya.', 'warning');
      }
      AppState.simState.detectiveIdx += 1;
      renderApp();
    }

    function updateSubstSim(val) {
      AppState.simState.substX = parseInt(val, 10);
      renderApp();
    }

    function resetBalanceSim() {
      AppState.simState.balanceLeftX = 2;
      AppState.simState.balanceLeftConst = 3;
      AppState.simState.balanceRightX = 1;
      AppState.simState.balanceRightConst = 8;
      renderApp();
    }

    function applyBalanceOp(op) {
      if (op === 'subX' && AppState.simState.balanceRightX > 0) {
        AppState.simState.balanceLeftX -= 1;
        AppState.simState.balanceRightX -= 1;
        showToast('Kedua ruas dikurangi 1x!', 'info');
      } else if (op === 'sub3' && AppState.simState.balanceLeftConst >= 3) {
        AppState.simState.balanceLeftConst -= 3;
        AppState.simState.balanceRightConst -= 3;
        showToast('Kedua ruas dikurangi 3!', 'info');
      }
      renderApp();
    }

    function setMachineStep(step) {
      AppState.simState.machineStep = step;
      renderApp();
    }

    function checkModelGeoSim() {
      const val = parseInt(document.getElementById('sim-model-x').value, 10);
      AppState.simState.modelGuessX = isNaN(val) ? '' : String(val);
      const fb = document.getElementById('sim-model-feedback');
      if (val === 5) {
        fb.innerHTML = `<span class="text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i>Benar! Untuk x = 5, panjang = 2(5)+3 = 13 cm, lebar = 5 cm, dan keliling = 2(13+5) = 36 cm.</span>`;
      } else {
        fb.innerHTML = `<span class="text-rose-600">Belum tepat (6(${val || 0}) + 6 = ${6 * (val || 0) + 6} ≠ 36). Coba x = 5!</span>`;
      }
    }

    // =========================================================================
    // 9. MESIN SOAL LATIHAN (10 SOAL PER SUBMATERI) & ASESMEN SUMATIF
    // =========================================================================
    function startPracticeQuiz(subId) {
      const questions = AppState.questions.filter(q => q.submaterialId === subId);
      AppState.quizSession = {
        subId,
        questions,
        answers: {},
        submitted: false,
        score: 0,
        correctCount: 0
      };
    }

    function renderQuestionCard(q, idx, sessionObj, prefix) {
      const userAns = sessionObj.answers[q.id];
      const isSubmitted = sessionObj.submitted;
      const isCorrect = isSubmitted ? checkQuestionCorrect(q, userAns) : false;

      let inputHtml = '';
      if (q.type === 'mcq' || q.type === 'tf' || q.type === 'story') {
        inputHtml = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            ${(q.options || []).map(opt => {
              const checked = userAns === opt;
              let style = checked ? 'border-indigo-600 bg-indigo-50 text-indigo-950' : 'border-slate-200 bg-white hover:bg-slate-50';
              if (isSubmitted) {
                if (opt === q.answer) style = 'border-emerald-600 bg-emerald-50 text-emerald-950';
                else if (checked && opt !== q.answer) style = 'border-rose-600 bg-rose-50 text-rose-950';
              }
              return `
                <button type="button" ${isSubmitted ? 'disabled' : ''} onclick="setQuizAnswer('${prefix}', '${q.id}', ${JSON.stringify(opt).replace(/"/g, '&quot;')})" class="p-3.5 rounded-2xl border-2 text-left text-xs sm:text-sm font-bold transition flex items-center gap-2.5 ${style}">
                  <span class="w-4 h-4 rounded-full border-2 flex-shrink-0 ${checked ? 'border-indigo-600 bg-indigo-600' : 'border-slate-400'}"></span>
                  <span>${Security.sanitize(opt)}</span>
                </button>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'mcma') {
        const selectedArr = Array.isArray(userAns) ? userAns : [];
        inputHtml = `
          <div class="space-y-2">
            <span class="text-[11px] font-bold text-indigo-700 block">*Pilih lebih dari satu jawaban yang benar</span>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${(q.options || []).map(opt => {
                const checked = selectedArr.includes(opt);
                return `
                  <button type="button" ${isSubmitted ? 'disabled' : ''} onclick="toggleMcmaAnswer('${prefix}', '${q.id}', ${JSON.stringify(opt).replace(/"/g, '&quot;')})" class="p-3.5 rounded-2xl border-2 text-left text-xs sm:text-sm font-bold transition flex items-center gap-2.5 ${checked ? 'border-indigo-600 bg-indigo-50 text-indigo-950' : 'border-slate-200 bg-white'}">
                    <i class="fa-solid ${checked ? 'fa-square-check text-indigo-600' : 'fa-square text-slate-300'} text-base"></i>
                    <span>${Security.sanitize(opt)}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (q.type === 'short') {
        inputHtml = `
          <div class="max-w-xs">
            <input type="text" ${isSubmitted ? 'disabled' : ''} value="${Security.sanitize(userAns || '')}" oninput="setQuizAnswer('${prefix}', '${q.id}', this.value)" class="w-full px-4 py-3 rounded-2xl border-2 border-slate-300 focus:border-indigo-600 focus:outline-none text-sm font-bold" placeholder="Ketik jawaban singkat..." />
          </div>
        `;
      } else if (q.type === 'match') {
        const curMap = (userAns && typeof userAns === 'object') ? userAns : {};
        const rightChoices = q.pairs.map(p => p.right);
        inputHtml = `
          <div class="space-y-2.5">
            ${q.pairs.map(p => `
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-3 rounded-2xl bg-slate-50 border border-slate-200">
                <span class="text-xs sm:text-sm font-bold text-slate-800">${Security.sanitize(p.left)}</span>
                <select ${isSubmitted ? 'disabled' : ''} onchange="setMatchAnswer('${prefix}', '${q.id}', ${JSON.stringify(p.left).replace(/"/g, '&quot;')}, this.value)" class="px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold bg-white">
                  <option value="">-- Pilih Pasangan --</option>
                  ${rightChoices.map(rc => `<option value="${Security.sanitize(rc)}" ${curMap[p.left] === rc ? 'selected' : ''}>${Security.sanitize(rc)}</option>`).join('')}
                </select>
              </div>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'drag') {
        const parts = String(userAns || ':').split(':');
        const box1 = parts[0] || '';
        const box2 = parts[1] || '';
        inputHtml = `
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center gap-2">
              <span class="text-xs font-extrabold text-slate-600">Kotak 1:</span>
              <select ${isSubmitted ? 'disabled' : ''} onchange="setDragAnswer('${prefix}', '${q.id}', 0, this.value)" class="px-3 py-2 rounded-xl border-2 border-indigo-300 text-xs font-extrabold bg-white">
                <option value="">-- Pilih --</option>
                ${(q.dragOptions || []).map(d => `<option value="${Security.sanitize(d)}" ${box1 === d ? 'selected' : ''}>${Security.sanitize(d)}</option>`).join('')}
              </select>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-extrabold text-slate-600">Kotak 2:</span>
              <select ${isSubmitted ? 'disabled' : ''} onchange="setDragAnswer('${prefix}', '${q.id}', 1, this.value)" class="px-3 py-2 rounded-xl border-2 border-indigo-300 text-xs font-extrabold bg-white">
                <option value="">-- Pilih --</option>
                ${(q.dragOptions || []).map(d => `<option value="${Security.sanitize(d)}" ${box2 === d ? 'selected' : ''}>${Security.sanitize(d)}</option>`).join('')}
              </select>
            </div>
          </div>
        `;
      }

      const typeBadges = {
        mcq: 'Pilihan Ganda',
        mcma: 'PG Kompleks',
        tf: 'Benar / Salah',
        short: 'Isian Singkat',
        match: 'Menjodohkan',
        drag: 'Susun Kotak',
        story: 'Soal Cerita'
      };

      return `
        <div class="p-5 rounded-3xl border-2 transition-all ${isSubmitted ? (isCorrect ? 'border-emerald-400 bg-gradient-to-br from-emerald-50/70 to-teal-50/40 shadow-md' : 'border-rose-300 bg-rose-50/40') : 'border-slate-200/90 bg-white shadow-sm hover:border-indigo-200'} space-y-3.5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-600 to-purple-600 text-white font-display font-black text-xs flex items-center justify-center shadow-sm">${idx + 1}</span>
              <span class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-[11px] font-extrabold">${typeBadges[q.type] || q.type}</span>
              <span class="px-2.5 py-1 rounded-lg bg-amber-100 text-amber-900 text-[11px] font-extrabold">${q.difficulty} (${q.cognitiveLevel})</span>
            </div>
            ${isSubmitted ? (
              isCorrect ? `
                <div class="flex items-center gap-2 animate-star-pop">
                  <span class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs font-black bg-gradient-to-r from-amber-400 to-yellow-400 text-slate-950 shadow-sm border border-amber-300">
                    <i class="fa-solid fa-star text-amber-700"></i> +10
                  </span>
                  <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-emerald-600 text-white shadow-sm">
                    <i class="fa-solid fa-check mr-1"></i>Benar
                  </span>
                </div>
              ` : `
                <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-rose-600 text-white">
                  <i class="fa-solid fa-xmark mr-1"></i>Kurang Tepat
                </span>
              `
            ) : `
              <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-amber-50 text-amber-700 border border-amber-200">
                <i class="fa-solid fa-star text-amber-500"></i> +10 XP
              </span>
            `}
          </div>
          <p class="font-bold text-slate-900 text-sm sm:text-base whitespace-pre-line">${Security.sanitize(q.question)}</p>
          ${inputHtml}
          ${isSubmitted ? `
            <div class="p-3.5 rounded-2xl bg-slate-900 text-slate-100 text-xs leading-relaxed">
              <strong class="text-amber-300">Pembahasan:</strong> ${Security.sanitize(q.explanation)}
            </div>
          ` : ''}
        </div>
      `;
    }

    function checkQuestionCorrect(q, userAns) {
      if (userAns === undefined || userAns === null) return false;
      if (q.type === 'mcq' || q.type === 'tf' || q.type === 'story') {
        return userAns === q.answer;
      }
      if (q.type === 'short' || q.type === 'drag') {
        return Security.normalizeAnswer(userAns) === Security.normalizeAnswer(q.answer);
      }
      if (q.type === 'mcma') {
        if (!Array.isArray(userAns) || !Array.isArray(q.answer)) return false;
        if (userAns.length !== q.answer.length) return false;
        const s1 = [...userAns].sort();
        const s2 = [...q.answer].sort();
        return s1.every((v, i) => v === s2[i]);
      }
      if (q.type === 'match') {
        if (typeof userAns !== 'object') return false;
        return q.pairs.every(p => userAns[p.left] === q.answer[p.left]);
      }
      return false;
    }

    function getTargetSession(prefix) {
      return prefix === 'sum' ? AppState.summativeSession : AppState.quizSession;
    }

    function setQuizAnswer(prefix, qId, val) {
      const sess = getTargetSession(prefix);
      if (!sess || sess.submitted) return;
      sess.answers[qId] = val;
      if (prefix !== 'sum' && document.activeElement?.tagName !== 'INPUT') renderApp();
      else if (prefix === 'sum' && document.activeElement?.tagName !== 'INPUT') renderApp();
    }

    function toggleMcmaAnswer(prefix, qId, opt) {
      const sess = getTargetSession(prefix);
      if (!sess || sess.submitted) return;
      const cur = Array.isArray(sess.answers[qId]) ? [...sess.answers[qId]] : [];
      const idx = cur.indexOf(opt);
      if (idx >= 0) cur.splice(idx, 1);
      else cur.push(opt);
      sess.answers[qId] = cur;
      renderApp();
    }

    function setMatchAnswer(prefix, qId, leftKey, rightVal) {
      const sess = getTargetSession(prefix);
      if (!sess || sess.submitted) return;
      const cur = (sess.answers[qId] && typeof sess.answers[qId] === 'object') ? { ...sess.answers[qId] } : {};
      cur[leftKey] = rightVal;
      sess.answers[qId] = cur;
      renderApp();
    }

    function setDragAnswer(prefix, qId, boxIndex, val) {
      const sess = getTargetSession(prefix);
      if (!sess || sess.submitted) return;
      const parts = String(sess.answers[qId] || ':').split(':');
      parts[boxIndex] = val;
      sess.answers[qId] = `${parts[0] || ''}:${parts[1] || ''}`;
      renderApp();
    }

    function renderPracticeQuizArea(sub) {
      if (!AppState.quizSession || AppState.quizSession.subId !== sub.id) {
        startPracticeQuiz(sub.id);
      }
      const sess = AppState.quizSession;
      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-3 p-4 rounded-2xl bg-gradient-to-r from-indigo-50 via-purple-50 to-amber-50 border border-indigo-200">
            <div>
              <h4 class="font-display font-extrabold text-base text-indigo-950">Latihan Mandiri (${sess.questions.length} Soal)</h4>
              <p class="text-xs text-indigo-700">Nilai minimal tuntas submateri adalah <strong>70</strong>. Setiap jawaban benar bernilai <strong><i class="fa-solid fa-star text-amber-500"></i> +10 XP</strong>!</p>
            </div>
            ${sess.submitted ? `
              <div class="flex flex-wrap items-center gap-2.5">

    function retryPracticeQuiz(subId) {
      startPracticeQuiz(subId);
      renderApp();

    function submitPracticeQuiz(subId) {
      const sess = AppState.quizSession;
      if (!sess) return;
      let correct = 0;
      sess.questions.forEach(q => {
        if (checkQuestionCorrect(q, sess.answers[q.id])) correct++;
      });
      const score = sess.questions.length ? Math.round((correct / sess.questions.length) * 100) : 0;
      sess.submitted = true;
      sess.correctCount = correct;
      sess.score = score;

      const student = getCurrentStudent();
      const prev = student.submaterialScores[subId];
      const earnedStarXp = correct * 10;
      student.points += earnedStarXp;
      student.submaterialScores[subId] = {
        score: prev ? Math.max(prev.score, score) : score,
        attempts: (prev ? prev.attempts : 0) + 1,
        lastDate: new Date().toISOString().slice(0, 10)
      };

      if (score >= 70 && !student.completedSubmaterials.includes(subId)) {
        student.completedSubmaterials.push(subId);
        student.points += 50;
        showToast(`Selamat! ${correct} jawaban benar (+${earnedStarXp} ⭐) & bonus tuntas +50 XP!`, 'success');
      } else if (score >= 70) {
        showToast(`Latihan selesai! ${correct} jawaban benar (+${earnedStarXp} ⭐ XP)!`, 'success');
      } else {
        showToast(`Kamu meraih +${earnedStarXp} ⭐ XP (Nilai ${score}). Pelajari pembahasan dan ulangi hingga >= 70!`, 'warning');
      }
      evaluateStudentBadges(student);
      renderApp();
    }

    function startSummativeExam() {
      let pool = [...AppState.questions];
      if (AppState.summativeConfig.randomize) {
        pool.sort(() => Math.random() - 0.5);
      }
      const selected = pool.slice(0, AppState.summativeConfig.questionCount);
      AppState.summativeSession = {
        questions: selected,
        answers: {},
        submitted: false,
        remainingSec: AppState.summativeConfig.durationMinutes * 60,
        startSec: AppState.summativeConfig.durationMinutes * 60
      };
      if (AppState.summativeTimerInterval) clearInterval(AppState.summativeTimerInterval);
      AppState.summativeTimerInterval = setInterval(() => {
        if (!AppState.summativeSession || AppState.summativeSession.submitted) {
          clearInterval(AppState.summativeTimerInterval);
          return;
        }
        AppState.summativeSession.remainingSec -= 1;
        const badge = document.getElementById('summative-timer-badge');
        if (badge) {
          const m = Math.max(0, Math.floor(AppState.summativeSession.remainingSec / 60));
          const s = Math.max(0, AppState.summativeSession.remainingSec % 60);
          badge.innerHTML = `<i class="fa-solid fa-clock mr-1.5"></i>${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }
        if (AppState.summativeSession.remainingSec <= 0) {
          submitSummativeExam();
        }
      }, 1000);
      renderApp();
    }

    function submitSummativeExam() {
      const sess = AppState.summativeSession;
      if (!sess || sess.submitted) return;
      if (AppState.summativeTimerInterval) clearInterval(AppState.summativeTimerInterval);

      let correct = 0;
      sess.questions.forEach(q => {
        if (checkQuestionCorrect(q, sess.answers[q.id])) correct++;
      });
      const score = sess.questions.length ? Math.round((correct / sess.questions.length) * 100) : 0;
      sess.submitted = true;

      const student = getCurrentStudent();
      const earnedStarXp = correct * 10;
      student.points += earnedStarXp;
      student.summativeHistory.push({
        attempt: student.summativeHistory.length + 1,
        score,
        correct,
        total: sess.questions.length,
        date: new Date().toISOString().slice(0, 10),
        durationSec: sess.startSec - sess.remainingSec
      });
      if (score >= AppState.summativeConfig.passingGrade) {
        student.points += 100;
      }
      evaluateStudentBadges(student);
      showToast(`Asesmen Sumatif selesai! ${correct} benar (+${earnedStarXp} ⭐ XP), Nilai akhir: ${score}`, score >= AppState.summativeConfig.passingGrade ? 'success' : 'warning');
      renderApp();
    }

    function saveNewClass() {

      closeModal();
      renderApp();

      openModal(`

    }

    function saveNewStudent() {
      const nis = document.getElementById('stu-new-nis').value.trim();
      const name = document.getElementById('stu-new-name').value.trim();
      const className = document.getElementById('stu-new-class').value;
      if (!nis || !name) {
        showToast('NIS dan Nama wajib diisi.', 'warning');
        return;
      }
      AppState.students.push({
        id: 'stu-' + Date.now(),
        name, nis, password: '123', className,
        points: 0, completedSubmaterials: [], badges: [],
        submaterialScores: {}, summativeHistory: [], reflections: {}
      });
      closeModal();
      showToast(`Akun murid ${name} berhasil dibuat (sandi: 123).`, 'success');
      renderApp();
    }

    function resetStudentPassword(id) {
      const st = AppState.students.find(s => s.id === id);
      if (st) {
        st.password = '123';
        showToast(`Sandi ${st.name} direset ke "123".`, 'info');
      }
    }

    function deleteStudent(id) {
      AppState.students = AppState.students.filter(s => s.id !== id);
      showToast('Data murid dihapus.', 'info');
      renderApp();
    }

        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
          <h3 class="font-display font-black text-xl text-slate-900">${existing ? 'Edit Submateri PLSV' : 'Tambah Submateri Baru'}</h3>

            <div>

              <select id="ed-sub-chap" ${existing ? 'disabled' : ''} class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-semibold bg-white">
                ${AppState.chapters.map(c => `<option value="${c.id}" ${existing && existing.chapterId === c.id ? 'selected' : ''}>Bab ${c.number}: ${Security.sanitize(c.title)}</option>`).join('')}

              <input id="ed-sub-goal" type="text" value="${Security.sanitize(existing ? existing.goal : '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-semibold" />

            <div>
              <label class="font-bold text-slate-700 block mb-1">Uraian Konsep (Gunakan baris kosong untuk paragraf baru)</label>
              <textarea id="ed-sub-exp" rows="5" class="w-full p-3.5 rounded-xl border border-slate-300 font-medium">${Security.sanitize(existing ? existing.explanation : '')}</textarea>
            </div>

            <div>

              <input id="ed-sub-summary" type="text" value="${Security.sanitize(existing ? existing.summary : '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-semibold" />

          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 font-bold text-xs">Batal</button>
            <button onclick="saveSubmaterialEdit('${subId || ''}')" class="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs">Simpan Perubahan</button>
          </div>
        </div>
      `);
    }

    function saveSubmaterialEdit(subId) {
      const chapId = document.getElementById('ed-sub-chap').value;
      const title = document.getElementById('ed-sub-title').value.trim();
      const goal = document.getElementById('ed-sub-goal').value.trim();
      const explanation = document.getElementById('ed-sub-exp').value.trim();
      const formula = document.getElementById('ed-sub-formula').value.trim();
      const summary = document.getElementById('ed-sub-summary').value.trim();
      if (!title || !explanation) {
        showToast('Judul dan uraian materi wajib diisi.', 'warning');
        return;
      }
      if (subId) {
        AppState.chapters.forEach(ch => {
          const target = ch.submaterials.find(s => s.id === subId);
          if (target) {
            target.title = title;
            target.goal = goal;
            target.explanation = explanation;
            target.formula = formula;
            target.summary = summary;
          }
        });
      } else {
        const chap = AppState.chapters.find(c => c.id === chapId);
        chap.submaterials.push({
          id: 'sub-custom-' + Date.now(),
          chapterId: chapId,
          order: chap.submaterials.length + 1,
          version: 1,
          status: 'published',
          title, goal,
          indicators: { pendukung: goal, inti: goal, pengayaan: goal },
          explanation,
          keyPoints: [summary],
          formula,
          interactiveType: 'balance-tp4',
          examples: [{ question: 'Contoh latihan ' + title, steps: ['Terapkan sifat kesetaraan PLSV.'], answer: 'Selesai' }],
          summary
        });
      }
      closeModal();
      showToast('Materi PLSV berhasil disimpan!', 'success');
      renderApp();
    }

            <div class="flex flex-wrap items-center gap-2">
              <select onchange="setQuestionSubFilter(this.value)" class="px-3.5 py-2.5 rounded-2xl border border-slate-300 text-xs font-bold bg-slate-50">
                <option value="ALL">Semua Submateri (${AppState.questions.length} Soal)</option>
                ${allSubs.map(s => `<option value="${s.id}" ${AppState.questionSubFilter === s.id ? 'selected' : ''}>Bab ${s.chapterNumber}.${s.order} — ${Security.sanitize(s.title)}</option>`).join('')}

              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                <div class="space-y-1.5">
                  <div class="flex flex-wrap items-center gap-2 text-[11px]">
                    <span class="px-2.5 py-0.5 rounded-lg bg-blue-100 text-blue-900 font-extrabold">#${i + 1} (${q.submaterialId})</span>

                <div class="flex items-center gap-2 self-start flex-shrink-0">
                  <button onclick="openEditQuestionModal('${q.id}')" class="px-3 py-1.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-xs">
                    <i class="fa-solid fa-pen mr-1"></i>Edit Soal
                  </button>
                  <button onclick="deleteQuestion('${q.id}')" class="px-3 py-1.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-800 font-bold text-xs">
                    <i class="fa-solid fa-trash mr-1"></i>Hapus
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

    function setQuestionSubFilter(val) {
      AppState.questionSubFilter = val;
      renderApp();

    function openEditQuestionModal(qId) {
      const q = AppState.questions.find(item => item.id === qId);
      if (!q) return;
      const allSubs = getAllSubmaterials();

      let dynamicFields = '';
      if (q.type === 'mcq' || q.type === 'story') {
        const opts = q.options || ['', '', '', ''];
        dynamicFields = `
          <div>
            <label class="font-bold text-slate-700 block mb-1">Pilihan Jawaban (4 Opsi)</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${[0, 1, 2, 3].map(idx => `
                <input id="eq-opt-${idx}" type="text" value="${Security.sanitize(opts[idx] || '')}" placeholder="Opsi ${idx + 1}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 font-semibold" />
              `).join('')}
            </div>
          </div>
          <div>
            <label class="font-bold text-emerald-700 block mb-1">Kunci Jawaban (Harus sama persis dengan salah satu opsi)</label>
            <input id="eq-answer" type="text" value="${Security.sanitize(q.answer || '')}" class="w-full px-3.5 py-2 rounded-xl border-2 border-emerald-400 font-bold" />
          </div>
        `;
      } else if (q.type === 'mcma') {
        const opts = q.options || ['', '', '', ''];
        const ansStr = Array.isArray(q.answer) ? q.answer.join(' | ') : '';
        dynamicFields = `
          <div>
            <label class="font-bold text-slate-700 block mb-1">Pilihan Jawaban PG Kompleks</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${[0, 1, 2, 3].map(idx => `
                <input id="eq-opt-${idx}" type="text" value="${Security.sanitize(opts[idx] || '')}" placeholder="Opsi ${idx + 1}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 font-semibold" />
              `).join('')}
            </div>
          </div>
          <div>
            <label class="font-bold text-emerald-700 block mb-1">Kunci Jawaban Benar (Pisahkan dengan tanda | )</label>
            <input id="eq-answer" type="text" value="${Security.sanitize(ansStr)}" class="w-full px-3.5 py-2 rounded-xl border-2 border-emerald-400 font-bold" />
          </div>
        `;
      } else if (q.type === 'tf') {
        dynamicFields = `
          <div>
            <label class="font-bold text-emerald-700 block mb-1">Kunci Jawaban Benar / Salah</label>
            <select id="eq-answer" class="w-full px-3.5 py-2.5 rounded-xl border-2 border-emerald-400 font-bold bg-white">
              <option value="Benar" ${q.answer === 'Benar' ? 'selected' : ''}>Benar</option>
              <option value="Salah" ${q.answer === 'Salah' ? 'selected' : ''}>Salah</option>
            </select>
          </div>
        `;
      } else if (q.type === 'short') {
        dynamicFields = `
          <div>
            <label class="font-bold text-emerald-700 block mb-1">Kunci Jawaban Isian Singkat</label>
            <input id="eq-answer" type="text" value="${Security.sanitize(q.answer || '')}" class="w-full px-3.5 py-2 rounded-xl border-2 border-emerald-400 font-bold" />
          </div>
        `;
      } else if (q.type === 'drag') {
        const dragOpts = (q.dragOptions || []).join(', ');
        dynamicFields = `
          <div>
            <label class="font-bold text-slate-700 block mb-1">Pilihan Kotak (Pisahkan dengan koma)</label>
            <input id="eq-drag-opts" type="text" value="${Security.sanitize(dragOpts)}" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 font-semibold" />
          </div>
          <div>
            <label class="font-bold text-emerald-700 block mb-1">Kunci Jawaban (Format Kotak1:Kotak2)</label>
            <input id="eq-answer" type="text" value="${Security.sanitize(q.answer || '')}" class="w-full px-3.5 py-2 rounded-xl border-2 border-emerald-400 font-bold" />
          </div>
        `;
      } else if (q.type === 'match') {
        const pairs = q.pairs || [];
        dynamicFields = `
          <div class="space-y-2">
            <label class="font-bold text-slate-700 block">Pasangan Pernyataan (Kiri ➔ Kanan)</label>
            ${pairs.map((p, idx) => `
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                <input id="eq-pair-l-${idx}" type="text" value="${Security.sanitize(p.left)}" class="px-3 py-1.5 rounded-lg border border-slate-300 font-semibold" />
                <input id="eq-pair-r-${idx}" type="text" value="${Security.sanitize(p.right)}" class="px-3 py-1.5 rounded-lg border border-emerald-400 font-semibold" />
              </div>
            `).join('')}
          </div>
        `;
      }

      openModal(`
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between">
            <h3 class="font-display font-black text-xl text-slate-900">Edit Soal (${q.type.toUpperCase()})</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="space-y-3 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              <div class="sm:col-span-2">
                <label class="font-bold text-slate-700 block mb-1">Submateri</label>
                <select id="eq-sub" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold bg-white">
                  ${allSubs.map(s => `<option value="${s.id}" ${q.submaterialId === s.id ? 'selected' : ''}>Bab ${s.chapterNumber}.${s.order} — ${Security.sanitize(s.title)}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="font-bold text-slate-700 block mb-1">Tingkat Kesulitan</label>
                <select id="eq-diff" class="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold bg-white">
                  ${['Mudah', 'Sedang', 'Sulit'].map(d => `<option value="${d}" ${q.difficulty === d ? 'selected' : ''}>${d}</option>`).join('')}
                </select>
              </div>
            </div>
            <div>
              <label class="font-bold text-slate-700 block mb-1">Teks Pertanyaan</label>
              <textarea id="eq-text" rows="3" class="w-full p-3 rounded-xl border border-slate-300 font-semibold">${Security.sanitize(q.question)}</textarea>
            </div>
            ${dynamicFields}
            <div>
              <label class="font-bold text-slate-700 block mb-1">Pembahasan Soal</label>
              <textarea id="eq-exp" rows="2" class="w-full p-3 rounded-xl border border-slate-300 font-medium">${Security.sanitize(q.explanation || '')}</textarea>
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-bold">Batal</button>
            <button onclick="saveEditedQuestion('${q.id}')" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow">Simpan Perubahan Soal</button>
          </div>
        </div>

    function saveEditedQuestion(qId) {
      const q = AppState.questions.find(item => item.id === qId);
      if (!q) return;

      const subId = document.getElementById('eq-sub').value;
      const diff = document.getElementById('eq-diff').value;
      const text = document.getElementById('eq-text').value.trim();
      const exp = document.getElementById('eq-exp').value.trim();

      if (!text) {
        showToast('Teks pertanyaan tidak boleh kosong.', 'warning');
        return;
      }

      const subObj = getAllSubmaterials().find(s => s.id === subId);
      q.submaterialId = subId;
      if (subObj) q.chapterId = subObj.chapterId;
      q.difficulty = diff;
      q.question = text;
      q.explanation = exp;

      if (q.type === 'mcq' || q.type === 'story') {
        const opts = [0, 1, 2, 3].map(i => document.getElementById(`eq-opt-${i}`).value.trim()).filter(Boolean);
        const ans = document.getElementById('eq-answer').value.trim();
        if (opts.length < 2 || !ans) {
          showToast('Minimal 2 opsi dan kunci jawaban wajib diisi.', 'warning');
          return;
        }
        q.options = opts;
        q.answer = ans;
      } else if (q.type === 'mcma') {
        const opts = [0, 1, 2, 3].map(i => document.getElementById(`eq-opt-${i}`).value.trim()).filter(Boolean);
        const ansArr = document.getElementById('eq-answer').value.split('|').map(s => s.trim()).filter(Boolean);
        if (opts.length < 2 || ansArr.length === 0) {
          showToast('Opsi dan kunci jawaban PG Kompleks wajib diisi.', 'warning');
          return;
        }
        q.options = opts;
        q.answer = ansArr;
      } else if (q.type === 'tf' || q.type === 'short') {
        const ans = document.getElementById('eq-answer').value.trim();
        if (!ans) {
          showToast('Kunci jawaban wajib diisi.', 'warning');
          return;
        }
        q.answer = ans;
      } else if (q.type === 'drag') {
        const dragOpts = document.getElementById('eq-drag-opts').value.split(',').map(s => s.trim()).filter(Boolean);
        const ans = document.getElementById('eq-answer').value.trim();
        if (dragOpts.length < 2 || !ans.includes(':')) {
          showToast('Pilihan kotak dan kunci format Kotak1:Kotak2 wajib diisi.', 'warning');
          return;
        }
        q.dragOptions = dragOpts;
        q.answer = ans;
      } else if (q.type === 'match') {
        const newPairs = [];
        const newAns = {};
        (q.pairs || []).forEach((_, idx) => {
          const l = document.getElementById(`eq-pair-l-${idx}`).value.trim();
          const r = document.getElementById(`eq-pair-r-${idx}`).value.trim();
          if (l && r) {
            newPairs.push({ left: l, right: r });
            newAns[l] = r;
          }
        });
        if (newPairs.length === 0) {
          showToast('Pasangan menjodohkan tidak boleh kosong.', 'warning');
          return;
        }
        q.pairs = newPairs;
        q.answer = newAns;
      }

      closeModal();
      showToast('Perubahan soal berhasil disimpan!', 'success');
      renderApp();
    }

    function exportReportCsv() {
      const rows = [['NIS', 'Nama', 'Kelas', 'Progres (%)', 'Total XP', 'Nilai Sumatif Terbaik']];
      AppState.students.forEach(st => {
        rows.push([st.nis, st.name, st.className, getStudentProgressPercent(st), st.points, getStudentBestSummative(st) ?? '']);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Laporan_EQUAQUEST_PLSV.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('File CSV berhasil diunduh!', 'success');
    }
